name: Build Unity Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  buildAndroid:
    name: Build Wise City RP for Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library directory
        uses: actions/cache@v4
        with:
          path: Underdog City/Library
          key: Library-UnderdogCity-Android-${{ hashFiles('Underdog City/Assets/**', 'Underdog City/Packages/**') }}
          restore-keys: |
            Library-UnderdogCity-Android-
            Library-UnderdogCity-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: "Underdog City"
          targetPlatform: Android
          androidAppBundle: false

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiseCityRP-Android-APK
          path: build/Android
          retention-days: 14
