name: Build Unity Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  buildAndroid:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Underdog City/Library
          key: Library-UnderdogCity-Android-${{ hashFiles('Underdog City/Assets/**', 'Underdog City/Packages/**') }}
          restore-keys: |
            Library-UnderdogCity-Android-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: "Underdog City"
          unityVersion: 2022.3.62f3
          targetPlatform: Android
          androidExportType: androidPackage
      - uses: actions/upload-artifact@v4
        with:
          name: WiseCityRP-Android-APK
          path: build/Android
          retention-days: 14
