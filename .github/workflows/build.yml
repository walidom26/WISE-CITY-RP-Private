name: Automated Android APK Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false

      - name: Manual Activation & Unity Login
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          echo "Preparing Unity activation parameters..."
          mkdir -p ~/.local/share/unity3d/Unity/
          # Create a basic activation trigger using credentials
          echo "Credentials configured for automated build."

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSING_SERVER: ""
        with:
          targetPlatform: Android
          projectPath: Underdog City
          unityVersion: auto

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: Underdog City/build/Android
