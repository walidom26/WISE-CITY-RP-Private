name: Build Unity Android APK

on:
  workflow_dispatch:

jobs:
  buildAndroid:
    name: Direct Automated Android APK Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library directory
        uses: actions/cache@v4
        with:
          path: Underdog City/Library
          key: Library-UnderdogCity-Android-${{ hashFiles('Underdog City/Assets/**', 'Underdog City/Packages/**') }}
          restore-keys: |
            Library-UnderdogCity-Android-
            Library-UnderdogCity-

      - name: Build Android APK (Automated Credentials & Licensing)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: "Underdog City"
          unityVersion: 2018.3.0f2
          targetPlatform: Android
          androidExportType: androidPackage
          unityLicensingServer: ${{ secrets.UNITY_LICENSING_SERVER }}

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiseCityRP-Android-APK
          path: build/Android
          retention-days: 14
