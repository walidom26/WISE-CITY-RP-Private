name: Import sanitized Unity snapshot
on:
  push:
    paths:
      - .github/workflows/import-sanitized-snapshot.yml
permissions:
  contents: write
jobs:
  import-snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Clone latest public source without history
        run: git clone --depth 1 https://github.com/walidom26/WISE-CITY-RP-.git /tmp/wise-city-source
      - name: Copy game files without signing material
        run: |
          rsync -a --delete --exclude='.git' --exclude='*.jks' --exclude='*.keystore' --exclude='.github/workflows/***' /tmp/wise-city-source/ ./
          find . -type f -iname '*.jks' -delete
          find . -type f -iname '*.keystore' -delete
          rm -f .github/workflows/import-sanitized-snapshot.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          cat > README.md <<'EOF'
          # WISE CITY RP - Mr Walid
          
          Mobile multiplayer role-play game built with Unity.
          
          Android signing material is intentionally excluded from this repository.
          EOF
          touch .gitignore
          grep -qxF '*.jks' .gitignore || printf '\n# Android signing material must stay out of Git\n*.jks\n*.keystore\n' >> .gitignore
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import sanitized Unity game snapshot'
          git push origin HEAD:main