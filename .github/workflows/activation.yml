name: Acquire Unity Activation File
on:
  workflow_dispatch:
jobs:
  requestActivationFile:
    name: Request Unity .alf Activation File
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Request activation file
        id: getActivationFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          projectPath: "Underdog City"
      - uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: ${{ steps.getActivationFile.outputs.filePath }}
          retention-days: 1
