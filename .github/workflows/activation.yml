name: Acquire Unity Activation File

on:
  workflow_dispatch:

jobs:
  requestActivationFile:
    name: Request Unity .alf Activation File
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Request activation file
        id: getActivationFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 2018.3.0f2

      - name: Upload activation file artifact (.alf)
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: ${{ steps.getActivationFile.outputs.filePath }}
          retention-days: 1
